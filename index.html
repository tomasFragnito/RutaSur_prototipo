${L.map(r=>`<div class="card"><div class="jb sm mut" style="display:flex"><span>Reserva: <b style="color:var(--b)">#${r.code}</b> · Emitido el ${fd(r.emit)} ${ft(r.emit)} hs</span><span class="tag ${r.est=='confirmada'?'ok':r.est=='cancelada'?'x':''}">${{confirmada:'Pago confirmado',finalizada:'Servicio finalizado',cancelada:'Cancelada'}[r.est]}</span></div>
<div class="row jb" style="margin-top:12px;align-items:center"><div style="flex:2"><b style="font-size:16px">${r.ruta}</b><div class="mut sm">${(SVC.find(x=>x.id==r.svc)||{}).tipo} · Salida ${fd(r.dep)} ${ft(r.dep)} hs</div></div>
<div><div class="sm mut">Pasajeros y ubicaciones</div><b>${esc(r.pas)}</b> · Butaca ${r.seat}<br><span class="mut sm">Total abonado:</span> <b>${fm(r.monto)}</b>${r.ref?`<br><span class="sm" style="color:var(--ok)">Reembolso: ${fm(r.ref)}</span>`:''}</div>
<div>${r.est=='confirmada'?`<button class="btn big" style="margin:0 0 8px" onclick="verTk('${r.code}')">Ver boleto QR (PDF)</button><button class="btn r big" style="margin:0" onclick="askCancel('${r.code}')">✕ Cancelar reserva</button>`:r.est=='finalizada'?`<button class="btn o big" style="margin:0" onclick="toast('Factura descargada (simulado)')">⬇ Descargar factura</button>`:''}</div></div></div>`).join('')||'<div class="card c mut">No hay reservas en esta sección.</div>'}
<div class="warn"><b>Políticas comerciales de cancelación y reembolso (RutaSur):</b><br>• Cancelaciones con más de 48 hs de anticipación a la salida: reintegro del <b>80%</b> del importe total abonado.<br>• Cancelaciones entre 24 y 48 hs antes: reintegro del <b>70%</b>. Con menos de 24 hs no aplican devoluciones.<br>• Al confirmar la cancelación, los asientos asociados se liberan en tiempo real para nuevos usuarios.</div>`};
function verTk(c){modal(tkt(R.find(r=>r.code==c))+'<div class="row noprint" style="justify-content:center;flex:0"><button class="btn" style="flex:0 0 auto" onclick="print()">⬇ Imprimir / PDF</button><button class="btn o" style="flex:0 0 auto" onclick="closeM()">Cerrar</button></div>')}
function askCancel(c){const r=R.find(x=>x.code==c),h=hrs(r),pc=h>48?.8:h>=24?.7:0;
if(h<24)return modal(`<h3>No es posible cancelar</h3><p>La reserva <b>#${c}</b> sale en menos de 24 hs. Con ese plazo ya no se puede cancelar ni se aplican devoluciones.</p><div class="r" style="margin-top:14px"><button class="btn" onclick="closeM()">Entendido</button></div>`);
modal(`<h3>Cancelar reserva #${c}</h3><p>${r.ruta} · ${fd(r.dep)} ${ft(r.dep)} hs</p><div class="warn">Salida en ${Math.floor(h)} hs → reintegro del <b>${pc*100}%</b>: <b>${fm(r.monto*pc)}</b> de ${fm(r.monto)}.</div><div class="row" style="margin-top:14px;justify-content:flex-end;flex:0"><button class="btn o" style="flex:0 0 auto" onclick="closeM()">Mantener reserva</button><button class="btn r" style="flex:0 0 auto" onclick="doCancel('${c}',${pc})">Confirmar cancelación</button></div>`)}
function doCancel(c,pc){const r=R.find(x=>x.code==c),s=SVC.find(x=>x.id==r.svc);r.est='cancelada';r.ref=r.monto*pc;if(s)s.occ=s.occ.filter(n=>n!=r.seat);closeM();toast('Reserva cancelada. Butaca liberada. Reembolso: '+fm(r.ref));render()}
/* ===== Boletería ===== */
const seatOpts=i=>{const s=SVC[i];return Array.from({length:16},(_,k)=>k+1).filter(n=>!s.occ.includes(n)).map(n=>`<option>${n}</option>`).join('')};
V.box=()=>{const q=S.bq.trim().toUpperCase(),d=q.replace(/\D/g,''),L=q?R.filter(r=>r.code.includes(q)||(d&&r.dni.replace(/\D/g,'').includes(d))):[],cj=S.caja.reduce((a,c)=>a+c.monto,0);
return`<div class="card jb" style="display:flex;margin-top:0"><div><b>Operador: ${esc(S.user.name)}</b><div class="mut sm">Boletería N° 04 · Terminal Retiro (turno mañana)</div></div><div><span class="mut sm">Total facturado en caja:</span> <b style="color:var(--ok);font-size:18px">${fm(cj)}</b> <button class="btn d sm" onclick="arqueo()">Arqueo de caja</button></div></div>
<div class="card"><div class="jb" style="display:flex"><h2 class="t">Búsqueda rápida de reservas para gestión o impresión</h2><span class="mut sm">DNI o código alfanumérico</span></div><div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="bq" value="${esc(S.bq)}" placeholder="Ej: 38450912 o RS-9438-MP" onkeydown="if(event.key=='Enter')bsearch()"><button class="btn or" style="flex:0 0 140px" onclick="bsearch()">🔍 Buscar pasaje</button></div>
<div class="ox" style="margin-top:12px"><table class="tbl"><tr><th>Código</th><th>Pasajero / DNI</th><th>Itinerario</th><th>Fecha / salida</th><th>Coche / asiento</th><th>Monto</th><th>Estado</th><th>Acciones</th></tr>
${L.map(r=>`<tr><td><code>${r.code}</code></td><td><b>${esc(r.pas)}</b><br><span class="mut sm">DNI: ${r.dni}</span></td><td>${r.ruta.replace('(CABA)','')}</td><td>${fd(r.dep)} · ${ft(r.dep)} hs</td><td>${(SVC.find(x=>x.id==r.svc)||{}).coche} · <b>Butaca ${r.seat}</b></td><td><b>${fm(r.monto)}</b></td><td><span class="tag ${r.est=='cancelada'?'x':r.canal=='Web'?'ok':'b'}">${r.est=='cancelada'?'Cancelado':r.canal=='Web'?'Emitido web':'Boletería'}</span></td>
<td style="white-space:nowrap"><button class="btn o sm" title="Imprimir" onclick="verTk('${r.code}')">🖨</button> <button class="btn o sm" title="Reprogramar" onclick="toast('Reprogramación disponible hasta 24 hs antes de la salida')">🔄</button> ${r.est=='confirmada'?`<button class="btn r sm" title="Anular" onclick="askCancel('${r.code}')">🗑</button>`:''}</td></tr>`).join('')||`<tr><td colspan="8" class="c mut">${q?'No se encontraron pasajes para esa búsqueda.':'Ingresá un DNI o código para buscar.'}</td></tr>`}</table></div></div>
<div class="card"><h2 class="t">⚡ Emisión express en mostrador (efectivo / Posnet)</h2><div class="g4"><div><label>Ruta inmediata</label><select id="xr" onchange="$('#xs').innerHTML=seatOpts(this.value)">${SVC.map((s,i)=>`<option value="${i}">Retiro → ${s.dest} (${s.h} hs)</option>`).join('')}</select></div><div><label>Butaca directa</label><select id="xs">${seatOpts(0)}</select></div><div><label>Pasajero (apellido y nombre)</label><input id="xn"></div><div><label>DNI</label><input id="xd"></div></div>
<div class="row" style="margin-top:6px"><div><label>Forma de pago ventanilla</label><select id="xp"><option>Efectivo</option><option>Posnet</option></select></div><button class="btn d" style="flex:0 0 200px" onclick="express()">🖨 Imprimir boleto</button></div></div>`};
function bsearch(){S.bq=$('#bq').value;if(!S.bq.trim())toast('Ingresá un DNI o código de reserva');render()}
function express(){const i=+$('#xr').value,s=SVC[i],n=+$('#xs').value,nm=$('#xn').value.trim(),dn=$('#xd').value.trim();if(!nm||!/^[\d.]{6,10}$/.test(dn))return toast('Ingresá apellido y nombre y un DNI válido');
let d=dep(iso(NOW),s.h);if(d<NOW)d=dep(iso(addD(1)),s.h);const r={code:'RS-'+(7000+Math.floor(Math.random()*999))+'-BO',pas:nm,dni:dn,ruta:'Retiro (CABA) → '+s.dest,svc:s.id,dep:d,seat:n,monto:s.price,est:'confirmada',canal:'Boletería',own:'x',emit:new Date()};
R.push(r);SALES.push({f:r.emit,monto:r.monto,ruta:'Retiro → '+s.dest});s.occ.push(n);S.caja.push({m:$('#xp').value,monto:r.monto});S.bq=r.code;toast('Boleto emitido y cobrado: '+fm(r.monto));render();verTk(r.code)}
function arqueo(){const t=m=>S.caja.filter(c=>c.m==m).reduce((a,c)=>a+c.monto,0);modal(`<h3>Arqueo de caja</h3><div class="sum"><div><span>Efectivo</span><b>${fm(t('Efectivo'))}</b></div><div><span>Posnet</span><b>${fm(t('Posnet'))}</b></div><div class="t"><span>Total</span><span>${fm(t('Efectivo')+t('Posnet'))}</span></div></div><div class="r" style="margin-top:14px"><button class="btn" onclick="closeM()">Cerrar</button></div>`)}
/* ===== Administración ===== */
V.adm=()=>{const m=SALES.filter(s=>s.f>=addD(-30)).reduce((a,s)=>a+s.monto,0),hoy=SALES.filter(s=>iso(s.f)==iso(NOW)).length,oc=T.reduce((a,t)=>a+t.occ/t.cap,0)/(T.length||1)*100;
const k=(l,v,s)=>`<div class="card kpi" style="margin:0"><div><span>${l}</span><b>${v}</b><span style="text-transform:none;color:var(--ok)">${s}</span></div></div>`;
return`<div class="g4">${k('Ventas digitales (30 días)',fm(m),'↗ Meta SMART: +25% reservas digitales')}${k('Ocupación de flota',oc.toFixed(1)+'%',T.length+' servicios programados')}${k('Pasajes emitidos hoy',hoy,'Web y boletería')}${k('Puntualidad de servicios','96.2%','Despachos a horario')}</div>
<div class="card"><div class="tabs" style="max-width:420px">${[['viajes','Viajes'],['flota','Flota'],['rep','Reportes']].map(([k,n])=>`<a class="${S.aT==k?'on':''}" onclick="S.aT='${k}';render()">${n}</a>`).join('')}</div><div style="margin-top:14px">${AD[S.aT]()}</div></div>`};
const AD={};
AD.viajes=()=>`<div class="jb" style="display:flex"><div><h2 class="t">Programación de servicios y control de unidades (ABM)</h2><span class="mut sm">Asignar choferes, unidades y actualizar tarifas.</span></div><button class="btn" onclick="tripForm(-1)">⊕ Programar nuevo viaje</button></div>
<div class="ox" style="margin-top:10px"><table class="tbl"><tr><th>ID viaje</th><th>Ruta</th><th>Horario</th><th>Unidad asignada</th><th>Ocupación</th><th>Tarifa base</th><th>Estado</th><th>Gestión</th></tr>
${T.map((t,i)=>`<tr><td><code>${t.id}</code></td><td><b>${t.o.replace(' (CABA)','')} ➜ ${t.d}</b></td><td>${t.dias} · ${t.h} hs</td><td><b>${t.coche}</b><br><span class="mut sm">${(B.find(b=>b.coche==t.coche)||{}).pat||''} · Chofer: ${esc(t.chofer)}</span></td><td><div class="bar2"><i style="width:${t.occ/t.cap*100}%"></i></div><span class="sm">${t.occ}/${t.cap} (${Math.round(t.occ/t.cap*100)}%)</span></td><td><b>${fm(t.tarifa)}</b></td><td><span class="tag ${t.est=='Programado'?'ok':'w'}">${t.est.toUpperCase()}</span></td>
<td style="white-space:nowrap"><button class="btn o sm" title="Editar" onclick="tripForm(${i})">✎</button> <button class="btn o sm" title="Habilitar / suspender" onclick="T[${i}].est=T[${i}].est=='Programado'?'Suspendido':'Programado';render()">⏯</button></td></tr>`).join('')}</table></div>`;
function tripForm(i){const t=i<0?{o:ORIG[0].replace('Terminal ',''),d:'Mar del Plata',h:'08:00',dias:'Diario',coche:B[0].coche,chofer:'',tarifa:''}:T[i],op=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
modal(`<h3>${i<0?'Programar nuevo viaje':'Editar viaje '+t.id}</h3><div class="g2"><div><label>Origen</label><select id="to">${op(['Retiro (CABA)','Avellaneda'],t.o)}</select></div><div><label>Destino</label><select id="td">${op([...DEST,'Retiro (CABA)'],t.d)}</select></div><div><label>Horario de salida</label><input id="th" type="time" value="${t.h}"></div><div><label>Días</label><input id="tdi" value="${t.dias}"></div>
<div><label>Colectivo asignado</label><select id="tc">${B.filter(b=>b.est=='Habilitado').map(b=>`<option ${b.coche==t.coche?'selected':''}>${b.coche}</option>`).join('')}</select></div><div><label>Chofer</label><input id="tch" value="${esc(t.chofer)}"></div><div><label>Tarifa base ($)</label><input id="tt" type="number" value="${t.tarifa}"></div></div><div id="err" class="err" hidden></div>
<div class="row" style="margin-top:14px;justify-content:flex-end;flex:0"><button class="btn o" style="flex:0 0 auto" onclick="closeM()">Cancelar</button><button class="btn" style="flex:0 0 auto" onclick="saveTrip(${i})">Guardar</button></div>`)}
function saveTrip(i){const v=id=>$('#'+id).value.trim(),er=m=>{$('#err').hidden=false;$('#err').textContent=m},o={o:v('to'),d:v('td'),h:v('th'),dias:v('tdi'),coche:v('tc'),chofer:v('tch'),tarifa:+v('tt')};
if(!o.h||!o.dias||!o.chofer||!o.coche)return er('Faltan datos obligatorios.');if(o.o==o.d)return er('El origen y el destino no pueden ser iguales.');if(!(o.tarifa>0))return er('El precio ingresado no es válido: debe ser mayor a cero.');
if(T.some((t,j)=>j!=i&&t.coche==o.coche&&t.h==o.h&&t.est=='Programado'))return er('El colectivo ya tiene otro servicio en ese horario. Elegí otro colectivo u horario.');
if(i<0){const b=B.find(x=>x.coche==o.coche);T.push({...o,id:'VJ-'+(300+T.length),occ:0,cap:b.cap,est:'Programado'})}else{Object.assign(T[i],o);const s=SVC.find(x=>x.id==T[i].id);if(s)s.price=o.tarifa}
closeM();toast('Servicio guardado correctamente');render()}
AD.flota=()=>`<div class="ox"><table class="tbl"><tr><th>Colectivo</th><th>Patente</th><th>Capacidad</th><th>Viajes asignados</th><th>Estado</th><th>Gestión</th></tr>${B.map((b,i)=>`<tr><td><b>${b.coche}</b></td><td>${b.pat}</td><td>${b.cap} butacas</td><td>${T.filter(t=>t.coche==b.coche).length}</td><td><span class="tag ${b.est=='Habilitado'?'ok':'w'}">${b.est}</span></td><td style="white-space:nowrap"><button class="btn o sm" onclick="B[${i}].est=B[${i}].est=='Habilitado'?'Deshabilitado':'Habilitado';render()">⏯</button> <button class="btn r sm" onclick="delBus(${i})">🗑</button></td></tr>`).join('')}</table></div>
<h2 class="t" style="margin-top:16px">Registrar colectivo</h2><div class="row"><div><label>Nombre</label><input id="bn" placeholder="Coche 120"></div><div><label>Patente</label><input id="bp" placeholder="AF 123 BC"></div><div><label>Capacidad</label><input id="bc" type="number" placeholder="40"></div><button class="btn" style="flex:0 0 120px" onclick="addBus()">Guardar</button></div>`;
function addBus(){const n=$('#bn').value.trim(),p=$('#bp').value.trim().toUpperCase(),c=+$('#bc').value;if(!n||!p||!(c>0))return toast('Datos incompletos o incorrectos');if(B.some(b=>b.pat==p))return toast('La patente ya está registrada: no se puede duplicar el vehículo');B.push({coche:n,pat:p,cap:c,est:'Habilitado'});toast('Colectivo registrado');render()}
function delBus(i){if(T.some(t=>t.coche==B[i].coche))return toast('No se puede eliminar: tiene viajes asignados. Podés deshabilitarlo.');B.splice(i,1);toast('Colectivo eliminado');render()}
AD.rep=()=>`<div class="row" style="flex:0"><div><label>Desde</label><input id="rf" type="date" value="${S.rf||iso(addD(-30))}"></div><div><label>Hasta</label><input id="rh" type="date" value="${S.rh||iso(NOW)}"></div><button class="btn" style="flex:0 0 140px" onclick="S.rf=$('#rf').value;S.rh=$('#rh').value;render()">Consultar</button></div><div id="rr">${rep()}</div>`;
function rep(){const f=S.rf||iso(addD(-30)),h=S.rh||iso(NOW);if(f>h)return'<div class="err">El período seleccionado no es válido: la fecha inicial es posterior a la final.</div>';
const L=SALES.filter(s=>iso(s.f)>=f&&iso(s.f)<=h);if(!L.length)return'<div class="ban x">No hay datos para mostrar en el período seleccionado.</div>';const g={};L.forEach(s=>{g[s.ruta]=g[s.ruta]||{n:0,m:0};g[s.ruta].n++;g[s.ruta].m+=s.monto});
return`<div class="g2" style="margin-top:14px"><div class="card" style="margin:0"><span class="mut sm">Pasajes vendidos</span><b style="font-size:26px;display:block">${L.length}</b></div><div class="card" style="margin:0"><span class="mut sm">Importe recaudado</span><b style="font-size:26px;display:block">${fm(L.reduce((a,s)=>a+s.monto,0))}</b></div></div><div class="ox" style="margin-top:12px"><table class="tbl"><tr><th>Ruta</th><th>Pasajes</th><th>Recaudado</th></tr>${Object.entries(g).map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td><b>${fm(v.m)}</b></td></tr>`).join('')}</table></div>`}
/* ===== Chofer ===== */
V.drv=()=>{const ab=M.filter(m=>m.ab).length,pe=M.length-ab,L=M.filter(m=>S.fil=='all'||(S.fil=='ab'?m.ab:!m.ab));
return`<div class="hero"><div><span class="pill">Control de abordaje y manifiesto de pasajeros</span><h1>Validación de boletos QR · Unidad N° 104</h1><p>Servicio Retiro (CABA) → Mar del Plata · Salida 08:00 hs · Plataforma 16</p></div><div class="pill">Chofer: Roberto Gómez · Legajo OP-418</div></div>
<div class="g3" style="margin-top:16px"><div class="card kpi" style="margin:0"><div><span>Pasajeros a bordo</span><b style="color:var(--ok)">${ab} <small class="mut" style="font-size:14px">/ ${M.length} butacas</small></b></div></div><div class="card kpi" style="margin:0"><div><span>Pendientes de ascenso</span><b style="color:#d97706">${pe} <small class="mut" style="font-size:14px">pasajeros</small></b></div></div><div class="card kpi" style="margin:0"><div><span>Estado del servicio</span><b style="font-size:17px;color:${S.closed?'var(--rd)':'var(--ok)'}">● ${S.closed?'Embarque cerrado':'Embarque en curso'}</b></div></div></div>
<div class="card"><div class="row" style="flex-wrap:nowrap"><button class="btn" style="flex:0 0 auto" onclick="scan()">📷 Activar cámara / escanear código QR</button><span style="flex:1"></span><input id="dq" placeholder="Validar por DNI o código…" style="max-width:240px" onkeydown="if(event.key=='Enter')dval()"><button class="btn d" style="flex:0 0 90px" onclick="dval()">Buscar</button></div>${S.msg?`<div class="ban ${S.msg[0]}">${S.msg[1]}</div>`:''}</div>
<div class="card"><div class="jb" style="display:flex"><h2 class="t">Manifiesto oficial de pasajeros (CNRT)</h2><span class="noprint">Filtro: ${[['all','Todos ('+M.length+')'],['ab','A bordo ('+ab+')'],['pe','Pendientes ('+pe+')']].map(([k,n])=>`<button class="btn ${S.fil==k?'':'o'} sm" onclick="S.fil='${k}';render()">${n}</button>`).join(' ')}</span></div>
<div class="ox" style="margin-top:10px"><table class="tbl"><tr><th>Butaca</th><th>Apellido y nombre</th><th>DNI</th><th>Reserva</th><th>Servicio</th><th>Estado abordaje</th><th class="noprint">Acción</th></tr>${L.map(m=>`<tr><td><b>${p2(m.b)}</b> <span class="mut sm">${m.piso}</span></td><td><b>${m.n}</b></td><td>${m.dni}</td><td><code>${m.res}</code></td><td>${m.t}</td><td><span class="tag ${m.ab?'ok':'w'}">${m.ab?'✓ A bordo ('+m.ab+' hs)':'Pendiente'}</span></td><td class="noprint">${m.ab?'<span class="mut sm">Validado</span>':`<button class="btn sm" onclick="vali(${M.indexOf(m)})">Validar</button>`}</td></tr>`).join('')}</table></div>
<div class="jb noprint" style="display:flex;margin-top:12px"><span class="mut sm">Mostrando ${L.length} de ${M.length} registros del servicio oficial.</span><span><button class="btn o" onclick="print()">🖨 Imprimir manifiesto</button> <button class="btn g" onclick="closeEmb()">✓ Cerrar embarque</button></span></div></div>`};
function vali(i){if(S.closed)return toast('El embarque ya está cerrado');const m=M[i];m.ab=ft(new Date());S.msg=['',`✓ ¡Abordaje validado con éxito! · Butaca ${m.b} (${m.piso}) · ${esc(m.n)} · DNI ${m.dni} · Pasaje ${m.res}`];render()}
function scan(){const m=M.findIndex(x=>!x.ab);if(m<0)S.msg=['x','Todos los pasajeros ya abordaron.'];else return vali(m);render()}
function dval(){const q=$('#dq').value.trim().toUpperCase(),d=q.replace(/\D/g,'');if(!q)return toast('Ingresá un DNI o código');const i=M.findIndex(m=>m.res.includes(q)||(d&&m.dni.replace(/\D/g,'')==d));
if(i<0){S.msg=['x','Pasaje no válido para este servicio: no figura en el manifiesto.'];render()}else if(M[i].ab){S.msg=['x','Este pasaje ya fue validado a las '+M[i].ab+' hs.'];render()}else vali(i)}
function closeEmb(){const pe=M.filter(m=>!m.ab).length;modal(`<h3>Cerrar embarque</h3><p>${pe?'Quedan '+pe+' pasajero(s) pendientes que figurarán como no presentados.':'Todos los pasajeros abordaron.'}</p><div class="row" style="margin-top:14px;justify-content:flex-end;flex:0"><button class="btn o" style="flex:0 0 auto" onclick="closeM()">Volver</button><button class="btn g" style="flex:0 0 auto" onclick="S.closed=true;closeM();toast('Embarque cerrado');render()">Confirmar cierre</button></div>`)}
render();
</script></body></html>
